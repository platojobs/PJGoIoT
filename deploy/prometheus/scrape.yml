# Prometheus 抓取配置样例（与 alerts.yml 配套）。
# 说明：
#   - api:8080 只在 compose 内部网络可达；/metrics 被 Caddy 显式拒绝公网访问。
#   - 健康检查依赖 blackbox-exporter（http_2xx 模块），需另行部署：
#       docker run -d --name blackbox-exporter -p 9115:9115 prom/blackbox-exporter
#   - 生产请按实际主机名、网络与 TLS 调整 targets。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

# Alertmanager 地址在 compose 内部为 alertmanager:9093；单独部署时改成实际地址。
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: pjgoiot-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: pjgoiot-api
          env: local

  - job_name: pjgoiot-api-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api:8080/api/v1/health
        labels:
          service: pjgoiot-api
          env: local
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

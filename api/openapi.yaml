openapi: 3.0.3
info:
  title: PJGoIoT API
  version: 0.6.0
  description: |
    蓝牙设备数据面板 App（Android + iOS）的后端接口（多用户 + 多设备数据同步）。

    统一约定：
    - 所有路径以 `/api/v1` 开头。
    - 成功响应为裸 JSON + HTTP 状态码，不使用 `{code,data}` 包装。
    - 失败响应固定为 `{"error":{"code":"...","message":"..."}}`。
    - 私有接口使用 `Authorization: Bearer <token>`；token 为不透明随机串，服务端仅存哈希，可吊销。
    - 数据分两层：`device_types` / `firmwares` / `accessories` / 公共设备元数据全局共享；
      `user_devices` 等私有数据按 `user_id` 隔离，越权访问统一返回 404。
    - 设备唯一键为 `(platform, externalId)`：
      Android 的 `externalId` 为规范化大写 MAC；iOS 的 `externalId` 为 `CBPeripheral.identifier`（UUID）。
      `mac` 仅作为可选元数据，不再参与唯一约束。
    - 公共设备查询的 MAC 规范化为小写冒号分隔的 6 字节形式。
    - 所有时间字段为 RFC 3339（UTC）。
    - 自 `0.4.0` 起支持设备测量读数（readings）：随 `/sync/push` 批量写入、按设备唯一键分页查询与聚合，
      服务端保留 90 天。读数按客户端生成的 `id` 幂等，不要求设备已存在于 `user_devices`。
    - 自 `0.5.0` 起读数链路新增长周期分桶序列 `/readings/series` 与指标清单 `/readings/metrics`：
      前者按 **UTC** 对齐做 `1m`/`1h`/`1d` 聚合，后者列出设备已上报的指标及其计数与时间范围。
    - 自 `0.6.0` 起支持跨设备接管与合规能力：
      `/auth/pairing-code` 生成一次性配对码，`/auth/pairing-code/claim` 用码换取**同一 userId** 的新 token；
      `/me/export` 导出账号全部数据（读数按 `recordedAt` 升序、游标分页），`DELETE /me` 硬删除账号及全部关联数据；
      `/metrics` 提供 Prometheus 文本指标（无需鉴权，可用 `METRICS_ENABLED=false` 关闭）。
      所有响应带 `X-Request-Id`（客户端可透传，服务端原样回写）。
    - 契约只增不删，客户端应忽略未知字段。
    - `401` 表示 token 缺失、无效或已吊销；客户端必须提示用户重新登录，**不得**自动调用
      `/auth/anonymous` 静默创建新账号。自动重登会更换 userId，导致同步游标与数据漂移。
    - 与 iOS 端 `docs/consistency.md` 保持一致；字段命名与键规则冲突时以本文件为准并同步修改两端文档。
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: 本地开发
tags:
  - name: system
  - name: auth
  - name: metadata
  - name: user
  - name: sync

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      summary: 健康检查
      description: 容器探针使用；不受限流影响。存储不可用时返回 503。
      responses:
        "200":
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                service: pjgoiot-api
                version: "0.6.0"
                store: postgres
                time: "2026-11-05T01:00:00Z"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /auth/anonymous:
    post:
      tags: [auth]
      operationId: createAnonymousUser
      security: []
      summary: 创建匿名用户并签发 token
      description: |
        请求体可为空。返回的 token 只在本次响应中出现，服务端保存 SHA-256 哈希。

        仅在用户明确选择「匿名使用」时调用一次。任何私有接口返回 `401` 时，客户端应提示重新登录，
        不应自动调用本接口：那会创建新的 userId，使旧账号的设备与同步游标失联。
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousResponse"
              example:
                userId: "3f2b8c1e-4d5a-4e6f-9a7b-0c1d2e3f4a5b"
                token: "pjiot_5f3a9c0d2e7b4a8c6d1e..."
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: 账号密码登录（后续实现）
      description: 当前固定返回 501，客户端应使用匿名登录。
      responses:
        "501":
          description: 尚未实现
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NOT_IMPLEMENTED
                  message: "账号密码登录尚未实现，请使用 /api/v1/auth/anonymous"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 吊销当前 token
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 吊销成功
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/pairing-code:
    post:
      tags: [auth]
      operationId: createPairingCode
      summary: 生成一次性配对码（换设备接管同一账号）
      description: |
        为当前用户签发 8 位大写配对码，字符集为 `ABCDEFGHJKLMNPQRSTUVWXYZ23456789`
        （去掉易混的 `0/O/1/I`），有效期 10 分钟。

        - 同一用户重复调用时，**新码立即使旧码失效**（旧码领取返回 404）；
        - 服务端只保存码的 SHA-256 哈希，码仅在本响应出现一次，不会写入日志；
        - 客户端应在用户主动点击「配对 / 迁移到新设备」时调用，并把 `code` 展示给用户在另一台设备输入。
      security:
        - bearerAuth: []
      responses:
        "201":
          description: 配对码已生成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCodeResponse"
              example:
                code: "K7M2QX9P"
                expiresAt: "2026-11-05T01:10:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/pairing-code/claim:
    post:
      tags: [auth]
      operationId: claimPairingCode
      summary: 用配对码换取同一账号的新 token
      description: |
        无需鉴权。校验通过后为该码所属账号签发**新 token**（同一 `userId`，数据天然共用），
        **原 token 保持有效，不吊销**。返回体不包含账号的其他信息。

        安全语义：
        - 过期、已用过、不存在、格式错误统一返回 `404 NOT_FOUND`，不区分原因，避免枚举；
        - 同一码累计失败 5 次即作废（失败计数按提交的码哈希落库，TTL 与签发一致，到期由清理任务回收）；
        - 码哈希比对使用常量时间比较；完整码不写入日志；
        - 本接口按 IP 独立限流（默认 20 次/分钟、突发 10，可用
          `PAIRING_CLAIM_RATE_PER_MINUTE` / `PAIRING_CLAIM_BURST` 调整），触发时返回 429。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingClaimRequest"
            example:
              code: "K7M2QX9P"
      responses:
        "200":
          description: 配对成功，返回该账号的新 token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingClaimResponse"
              example:
                userId: "4f0c2b1e-8a55-4c3f-9c1f-2b7a6d0e9a11"
                token: "pj_7Yk2mQ9xP4rT8sV1"
        "400":
          description: 请求体不是合法 JSON，或缺 `code`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_JSON
                  message: "请求体不是合法 JSON"
        "404":
          description: 配对码无效、已过期或已被使用（不区分原因）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: NOT_FOUND
                  message: "配对码无效或已过期"
        "429":
          $ref: "#/components/responses/RateLimited"

  /me/export:
    get:
      tags: [user]
      operationId: exportMyData
      summary: 导出当前账号全部数据
      description: |
        返回 `{user, devices, readings, exportedAt}`，并附分页字段 `nextCursor` / `hasMore`。

        - `devices` 包含该账号全部设备（含已删除的 tombstone），按 `updatedAt` 倒序；
        - `readings` 按 `recordedAt` **升序**，同一时刻按 `id` 升序，保证翻页稳定；
        - `limit` 默认 5000、最大 5000；账号读数超过限制时客户端携带 `nextCursor` 继续拉取，
          直到 `hasMore=false`（此时 `nextCursor` 为空串）；
        - `cursor` 为不透明串，客户端不得解析或构造；
        - 响应头 `Content-Disposition: attachment; filename="pjkotlinapp-export-<userId>.json"`。
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: 上一页的 nextCursor；第一页省略
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 单页读数条数
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 5000
      responses:
        "200":
          description: 导出 JSON
          headers:
            Content-Disposition:
              description: 附件文件名，含当前 userId
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    delete:
      tags: [user]
      operationId: deleteMyAccount
      summary: 注销账号并硬删除全部数据
      description: |
        硬删除当前用户，以及其设备（含 tombstone）、读数、变更日志、幂等键、token 与配对码
        （数据库外键 `ON DELETE CASCADE`），成功返回 `204`。

        语义：
        - 该账号已签发的**所有 token 立即失效**，后续请求返回 401；
        - 幂等：重复调用（原 token 已失效）返回 **401**，而不是 404；
        - 不可恢复；客户端调用前必须二次确认。
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 账号及其全部数据已删除
        "401":
          $ref: "#/components/responses/Unauthorized"

  /devices/{mac}:
    get:
      tags: [metadata]
      operationId: getPublicDevice
      security: []
      summary: 查询公共设备元数据
      description: 按 MAC 返回厂商、型号、设备类型、参考固件版本、GATT 服务与兼容性。无需鉴权。
      parameters:
        - $ref: "#/components/parameters/Mac"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicDevice"
        "400":
          description: MAC 格式非法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: INVALID_MAC
                  message: "MAC 地址格式不合法，需为 6 字节蓝牙地址"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /device-types:
    get:
      tags: [metadata]
      operationId: listDeviceTypes
      security: []
      summary: 设备类型列表
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeviceType"

  /device-types/{type}:
    get:
      tags: [metadata]
      operationId: getDeviceType
      security: []
      summary: 按类型查询设备类型元数据
      description: 供无法获取 MAC 的 iOS 端按型号查询。返回设备类型名称、厂商、描述与 GATT 服务列表。
      parameters:
        - $ref: "#/components/parameters/DeviceType"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceType"
        "404":
          $ref: "#/components/responses/NotFound"

  /device-types/{type}/catalog:
    get:
      tags: [metadata]
      operationId: getDeviceCatalog
      security: []
      summary: 按类型聚合设备元数据、固件与配件
      description: |
        一次返回型号详情、固件列表与配件列表，不依赖 MAC，供 iOS 产品/市场/详情页使用。
        历史端点 `/device-types/{type}/firmwares` 与 `/device-types/{type}/accessories` 保持可用。
        自 `0.3.2` 起，`firmwares` 与 `accessories` 均带 `vendor` 与 `compatibility`，
        市场模块可按厂商与兼容性在客户端筛选；`deviceType.compatibility` 为型号级兼容性。
        空列表返回 `[]` 而不是 `null`。
      parameters:
        - $ref: "#/components/parameters/DeviceType"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCatalog"
        "404":
          $ref: "#/components/responses/NotFound"

  /device-types/{type}/firmwares:
    get:
      tags: [metadata]
      operationId: listFirmwares
      security: []
      summary: 指定设备类型的固件列表
      parameters:
        - $ref: "#/components/parameters/DeviceType"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Firmware"
        "404":
          $ref: "#/components/responses/NotFound"

  /device-types/{type}/accessories:
    get:
      tags: [metadata]
      operationId: listAccessories
      security: []
      summary: 指定设备类型的配件列表
      parameters:
        - $ref: "#/components/parameters/DeviceType"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Accessory"
        "404":
          $ref: "#/components/responses/NotFound"

  /my/devices:
    get:
      tags: [user]
      operationId: listMyDevices
      summary: 当前用户的设备列表（不含已删除）
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserDevice"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /my/devices/{mac}:
    get:
      tags: [user]
      operationId: getMyDevice
      summary: 按 MAC 查询当前用户的单台设备（仅 Android）
      description: |
        按 mac 元数据查询 token 对应用户的设备；其他用户的设备一律返回 404，已删除返回 404。
        `mac` 不是唯一键，同一用户可能有多条相同 mac 的记录（例如 Android 与 iOS 各一条），
        此时返回 updatedAt 最新的一条。

        iOS 无法获取 MAC，必须使用 `GET /my/devices/{platform}/{externalId}` 查询单台设备。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Mac"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDevice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /my/devices/{platform}/{externalId}:
    get:
      tags: [user]
      operationId: getMyDeviceByKey
      summary: 按 (platform, externalId) 查询当前用户的单台设备
      description: |
        以设备唯一键查询，供 iOS 使用 `CBPeripheral.identifier` 定位设备，无需 MAC。
        `platform` 取 `android` 或 `ios`（大小写不敏感）；Android 的 `externalId` 必须是 MAC，
        iOS 的 `externalId` 必须是 UUID。服务端统一规范化为大写后再匹配。
        其他用户的设备、已删除的记录与不存在的键一律返回 404。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/ExternalId"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDevice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /my/devices/{platform}/{externalId}/readings:
    get:
      tags: [user]
      operationId: listDeviceReadings
      summary: 查询某设备的测量读数
      description: |
        按 `recordedAt` **倒序**返回，使用不透明游标分页：

        - `limit` 取 1–500，默认 100；`hasMore=true` 时用 `nextCursor` 拉取下一页；
        - `nextCursor` 为空串表示没有更多；
        - `metric` 可选，用于按指标过滤（必须是小写 snake_case）；
        - `from` / `to` 可选，RFC3339，闭区间过滤 `recordedAt`；
        - 越权、设备已删除或设备不存在统一返回 404；
        - 隐式设备（只在 push 中提交过读数、未在 `user_devices` 注册）在注册前查询返回 404。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/ExternalId"
        - name: metric
          in: query
          required: false
          description: 指标名，小写 snake_case，1–32 字符
          schema:
            type: string
            example: temperature_celsius
        - name: from
          in: query
          required: false
          description: 起始时间（含），RFC3339
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: 结束时间（含），RFC3339
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          required: false
          description: 上一页返回的 `nextCursor`
          schema:
            type: string
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingsPage"
              example:
                items:
                  - id: "22222222-2222-4222-8222-222222222222"
                    metric: temperature_celsius
                    value: 21.5
                    unit: celsius
                    recordedAt: "2026-11-05T00:00:00Z"
                  - id: "33333333-3333-4333-8333-333333333333"
                    metric: temperature_celsius
                    value: 21.2
                    unit: celsius
                    recordedAt: "2026-11-04T23:55:00Z"
                nextCursor: ""
                hasMore: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /my/devices/{platform}/{externalId}/readings/summary:
    get:
      tags: [user]
      operationId: getDeviceReadingsSummary
      summary: 某设备指定指标的读数聚合
      description: |
        返回最近 `hours` 小时（默认 24，范围 1–2160）内单个指标的统计值。

        - `metric` **必填**；缺失返回 400（聚合结果只对应一个单位）；
        - `windowStart = now - hours`，`windowEnd = now`，闭区间；
        - 无数据时 `count: 0`，`min`/`max`/`avg`/`last` 均为 `null`，`unit` 为空串；
        - 有数据时 `unit` 取窗口内最新一条读数的单位，`last` 为窗口内 `recordedAt` 最新的值；
        - 越权、设备已删除或设备不存在统一返回 404。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/ExternalId"
        - name: metric
          in: query
          required: true
          description: 指标名，小写 snake_case，1–32 字符
          schema:
            type: string
            example: temperature_celsius
        - name: hours
          in: query
          required: false
          description: 聚合窗口小时数，1–2160（90 天，与服务端保留期一致）
          schema:
            type: integer
            minimum: 1
            maximum: 2160
            default: 24
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingsSummary"
              example:
                metric: temperature_celsius
                unit: celsius
                count: 3
                min: 21.2
                max: 21.5
                avg: 21.36
                last: 21.5
                windowStart: "2026-11-04T01:00:00Z"
                windowEnd: "2026-11-05T01:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /my/devices/{platform}/{externalId}/readings/series:
    get:
      tags: [user]
      operationId: getDeviceReadingsSeries
      summary: 某设备指定指标的长周期分桶序列
      description: |
        把任意时间范围内的读数聚合为固定粒度的桶，逐桶返回 `count`/`min`/`max`/`avg`/`last`。

        - `metric`、`from`、`to`、`bucket` 均 **必填**，缺失或非法返回 400；
        - `bucket` 只能是 `1m`、`1h`、`1d`；
        - `from`/`to` 为 RFC3339，闭区间（`recordedAt >= from && recordedAt <= to`），要求 `to > from`；
        - 时间跨度上限 **90 天**（与服务端保留期一致），超出返回 400；
        - 单次最多返回 **500** 个桶；参数会产生的桶数超过 500 时返回 400，提示改用更粗的 `bucket` 或缩短范围；
        - 桶边界按 **UTC** 对齐：`1m` 对齐整分钟、`1h` 对齐整点、`1d` 对齐 UTC 零点（00:00:00Z），
          与客户端本地时区和夏令时无关；`start` 为桶起点（含），`end = start + bucket`（不含）；
        - 只返回 `count > 0` 的桶，按 `start` 升序；范围内无数据时 `buckets: []` 且 HTTP 200；
        - `last` 为桶内 `recordedAt` 最大的读数值（同一时刻按 `id` 倒序取第一条）；
        - 响应的 `unit` 取时间范围内最新一条读数的单位；
        - 越权、设备已删除或设备不存在统一返回 404。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/ExternalId"
        - name: metric
          in: query
          required: true
          description: 指标名，小写 snake_case，1–32 字符
          schema:
            type: string
            example: temperature_celsius
        - name: from
          in: query
          required: true
          description: 起始时间（含），RFC3339，必须早于 `to`
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: 结束时间（含），RFC3339；与 `from` 的跨度不超过 90 天
          schema:
            type: string
            format: date-time
        - name: bucket
          in: query
          required: true
          description: 分桶粒度，UTC 对齐
          schema:
            type: string
            enum: ["1m", "1h", "1d"]
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingsSeries"
              example:
                metric: temperature_celsius
                unit: celsius
                bucket: 1h
                from: "2026-11-04T00:00:00Z"
                to: "2026-11-05T00:00:00Z"
                buckets:
                  - start: "2026-11-04T01:00:00Z"
                    end: "2026-11-04T02:00:00Z"
                    count: 12
                    min: 20.9
                    max: 21.8
                    avg: 21.35
                    last: 21.8
                  - start: "2026-11-04T02:00:00Z"
                    end: "2026-11-04T03:00:00Z"
                    count: 5
                    min: 21.0
                    max: 21.4
                    avg: 21.2
                    last: 21.1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /my/devices/{platform}/{externalId}/readings/metrics:
    get:
      tags: [user]
      operationId: listDeviceReadingMetrics
      summary: 某设备已上报的指标清单
      description: |
        返回该设备出现过的全部指标，按 `lastAt` **倒序**（同一 `lastAt` 时按 `metric` 升序）。

        - `count` 为该指标的读数总数，`firstAt`/`lastAt` 为最早/最晚的 `recordedAt`；
        - `unit` 为该指标最近一条读数（`recordedAt` 最大）的单位；同一指标存在多个单位时，
          客户端应以此单位展示（历史读数可能使用旧单位）；
        - 设备已注册但从未上报读数时 `items: []` 且 HTTP 200；
        - 越权、设备已删除或设备不存在统一返回 404。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/ExternalId"
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingMetrics"
              example:
                items:
                  - metric: relative_humidity
                    unit: "%"
                    count: 42
                    firstAt: "2026-11-01T00:00:00Z"
                    lastAt: "2026-11-04T23:59:00Z"
                  - metric: temperature_celsius
                    unit: celsius
                    count: 168
                    firstAt: "2026-10-30T00:00:00Z"
                    lastAt: "2026-11-04T23:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /sync/changes:
    get:
      tags: [sync]
      operationId: getSyncChanges
      summary: 拉取自 cursor 之后的增量变更
      description: |
        `change_log` 按 user_id 隔离，seq 单调递增。客户端保存 `nextCursor`，
        下次携带该值继续拉取。`limit` 默认 100，范围 1-500。

        每条变更的 `payload` 为 `UserDevice`，包含 `platform`、`externalId` 与可选 `mac`；
        `entityId` 为 `<userId>:<platform>:<externalId>` 派生的稳定字符串。
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: 上次响应的 nextCursor；首次传 0 或省略
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: 单页条数，默认 100
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sync/push:
    post:
      tags: [sync]
      operationId: pushSyncChanges
      summary: 批量提交本地设备变更
      description: |
        字段级 LWW：
        - 比较 `updatedAt`；客户端时间严格更新则接受；
        - 客户端时间超前服务端 2 分钟以上时，以服务端当前时间兜底；
        - 时间相同且内容一致视为幂等无操作；
        - 否则服务端获胜，落败数据放入 `conflicts`，绝不静默覆盖；
        - `deleted=true` 只写 tombstone（`deletedAt`），不物理删除。

        `Idempotency-Key` 在同一用户下唯一。相同 key + 相同请求体重复提交直接返回历史响应，
        响应头带 `Idempotent-Replayed: true`；相同 key + 不同请求体返回 409。

        可缺省字段语义（自 `0.3.3`，字段 JSON 类型不变）：
        - 字段缺失（absent）：未上报，服务端保持原值，不参与内容比较；
        - `"group": ""`：显式清除分组，服务端把 `group` 置为空串；
        - 显式非空值：覆盖原值；
        - `alias` 与 `advertisedName` 独立：上报广播名不会覆盖用户别名，反之亦然。
          客户端扫描时应只上报 `advertisedName`，只有用户编辑别名时才上报 `alias`。

        读数（自 `0.4.0`）：
        - `readings` 可选，单批最多 500 条；`devices` 与 `readings` 至少提供一个（都为空返回 400）；
        - 读数按客户端生成的 `id` 幂等：重复 id 不报错，计入 `skippedReadings`；
          同 id 但内容不同时不覆盖，计入 `skippedReadings` 并在 `conflicts` 里追加
          `{entity: "reading", reason: "duplicate_id", reading: {...}}`；
        - 读数**不要求**设备已存在于 `user_devices`：未注册设备按「隐式设备」接受写入，
          注册后即可通过 `/my/devices/{platform}/{externalId}/readings` 查询；
        - `readings` 缺失时行为与旧客户端完全一致，`appliedReadings` / `skippedReadings` 恒为 0；
        - 读数不受字段级 LWW 影响，一经写入不可修改（只有 90 天保留期清理）。
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 幂等键，最长 128 字符；建议使用客户端生成的 UUID
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRequest"
            example:
              clientId: android-demo
              devices:
                - id: "11111111-1111-4111-8111-111111111111"
                  platform: android
                  externalId: "AA:BB:CC:00:00:01"
                  mac: "aa:bb:cc:00:00:01"
                  alias: "客厅开发板"
                  advertisedName: "PJ-Sensor"
                  group: "客厅"
                  rules:
                    sampleRate: 10
                  scanRecords:
                    - rssi: -55
                      at: "2026-11-05T00:00:00Z"
                  updatedAt: "2026-11-05T00:00:00Z"
                  deleted: false
                - id: "22222222-2222-4222-8222-222222222222"
                  platform: ios
                  externalId: "E621E1F8-C36C-495A-93FC-0C247A3E6E5F"
                  advertisedName: "Polar H10"
                  alias: "iOS 连接的开发板"
                  updatedAt: "2026-11-05T00:00:00Z"
                  deleted: false
              readings:
                - id: "44444444-4444-4444-8444-444444444444"
                  platform: android
                  externalId: "AA:BB:CC:00:00:01"
                  metric: temperature_celsius
                  value: 21.5
                  unit: celsius
                  recordedAt: "2026-11-05T00:00:00Z"
                  deviceType: nordic_uart
      responses:
        "200":
          description: 处理完成（可能包含 conflicts）
          headers:
            Idempotent-Replayed:
              description: 命中幂等缓存时为 true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Idempotency-Key 对应的请求体不一致
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: IDEMPOTENCY_CONFLICT
                  message: "该 Idempotency-Key 已用于不同的请求体"
        "413":
          description: 请求体过大（超过 1 MiB）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /metrics:
    servers:
      - url: http://127.0.0.1:8080
        description: 根路径（/metrics 不在 /api/v1 前缀下）
    get:
      tags: [system]
      operationId: getMetrics
      summary: Prometheus 文本指标
      description: |
        无需鉴权，且**不受 API 限流影响**（与 `/api/v1/health` 同样跳过每 IP 限流）。
        默认开启；设置 `METRICS_ENABLED=false` 后该路由不注册（返回 404）。

        指标清单（均为近似/聚合值，不暴露可定位到个人的精确业务数据）：
        - `pjgoiot_http_requests_total{method,status}`：累计请求数；
        - `pjgoiot_http_request_duration_seconds_bucket{method,le}` / `_sum` / `_count`：请求延迟直方图（秒）；
        - `pjgoiot_db_errors_total`：存储层错误计数；
        - `pjgoiot_users_approx` / `pjgoiot_devices_approx` / `pjgoiot_readings_approx`：
          用户/设备/读数行数近似值，读取 `pg_class.reltuples`，不对大表执行 `COUNT`。

        部署建议：仅在监听内网或由反向代理限制访问的实例上暴露本端点。
      security: []
      responses:
        "200":
          description: Prometheus 文本格式（version=0.0.4）
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP pjgoiot_http_requests_total HTTP 请求总数，按 method 与 status 分组。
                # TYPE pjgoiot_http_requests_total counter
                pjgoiot_http_requests_total{method="GET",status="200"} 12
                # HELP pjgoiot_http_request_duration_seconds HTTP 请求耗时直方图。
                # TYPE pjgoiot_http_request_duration_seconds histogram
                pjgoiot_http_request_duration_seconds_bucket{method="GET",le="0.005"} 10
                pjgoiot_http_request_duration_seconds_bucket{method="GET",le="+Inf"} 12
                pjgoiot_http_request_duration_seconds_sum{method="GET"} 0.031000
                pjgoiot_http_request_duration_seconds_count{method="GET"} 12
                # TYPE pjgoiot_db_errors_total counter
                pjgoiot_db_errors_total 0
                # TYPE pjgoiot_users_approx gauge
                pjgoiot_users_approx 3
                # TYPE pjgoiot_devices_approx gauge
                pjgoiot_devices_approx 5
                # TYPE pjgoiot_readings_approx gauge
                pjgoiot_readings_approx 140
        "404":
          description: 未注册该路由（`METRICS_ENABLED=false`）

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
      description: POST /auth/anonymous 返回的不透明 token；服务端仅存哈希，可通过 POST /auth/logout 吊销。收到 401 时应提示重新登录，不要自动创建新匿名账号。

  parameters:
    Mac:
      name: mac
      in: path
      required: true
      description: 蓝牙 MAC，接受大写/小写、冒号/连字符或连续 12 位十六进制；服务端规范化为小写冒号
      schema:
        type: string
        example: "aa:bb:cc:00:00:01"
    DeviceType:
      name: type
      in: path
      required: true
      description: 设备类型 slug，如 nordic_uart、environmental_sensor
      schema:
        type: string
        example: nordic_uart
    Platform:
      name: platform
      in: path
      required: true
      description: 平台，取 android 或 ios，大小写不敏感
      schema:
        type: string
        example: ios
    ExternalId:
      name: externalId
      in: path
      required: true
      description: 设备唯一键。Android 为 MAC；iOS 为 CBPeripheral.identifier（UUID）。服务端统一规范化为大写
      schema:
        type: string
        maxLength: 128
        example: E621E1F8-C36C-495A-93FC-0C247A3E6E5F

  responses:
    BadRequest:
      description: 参数或请求体不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: BAD_REQUEST
              message: "请求参数校验失败"
    Unauthorized:
      description: |
        token 缺失、无效或已吊销。这是明确的重新登录信号：
        客户端应提示用户重新登录，不得自动调用 POST /auth/anonymous 静默新建匿名账号，
        否则 userId 会变化并导致设备列表与同步游标漂移。
        本响应只包含错误体，不会下发新 token。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: "token 无效或已吊销"
    NotFound:
      description: 资源不存在，或当前用户无权访问
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: "资源不存在或无权访问"
    RateLimited:
      description: 触发每 IP 限流
      headers:
        Retry-After:
          schema:
            type: string
          description: 建议等待秒数
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: RATE_LIMITED
              message: "请求过于频繁，请稍后再试"
    ServiceUnavailable:
      description: 存储不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAVAILABLE
              message: "存储不可用"
    InternalError:
      description: 服务内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL
              message: "服务内部错误"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 稳定的错误码
              enum:
                - BAD_REQUEST
                - INVALID_MAC
                - INVALID_JSON
                - UNAUTHORIZED
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - CONFLICT
                - IDEMPOTENCY_CONFLICT
                - RATE_LIMITED
                - PAYLOAD_TOO_LARGE
                - NOT_IMPLEMENTED
                - UNAVAILABLE
                - INTERNAL
            message:
              type: string
              description: 面向开发者的说明，不应作为分支依据

    Health:
      type: object
      required: [status, service, version, store, time]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        version:
          type: string
        store:
          type: string
          enum: [fixture, postgres]
        time:
          type: string
          format: date-time

    AnonymousResponse:
      type: object
      required: [userId, token]
      properties:
        userId:
          type: string
          format: uuid
        token:
          type: string
          description: 不透明 token，仅在创建时返回一次

    GATTService:
      type: object
      required: [uuid, name]
      properties:
        uuid:
          type: string
          description: 128 位 GATT 服务 UUID
        name:
          type: string

    Compatibility:
      type: object
      description: 兼容性信息，保留扩展字段
      additionalProperties: true
      properties:
        platforms:
          type: array
          items:
            type: string
        minAppVersion:
          type: string
        protocol:
          type: string
          example: ble-gatt
        features:
          type: array
          items:
            type: string

    PublicDevice:
      type: object
      required: [mac, vendor, model, deviceType, firmwareVersion, gattServices, compatibility]
      properties:
        mac:
          type: string
        vendor:
          type: string
        model:
          type: string
        deviceType:
          type: string
        firmwareVersion:
          type: string
          description: 公共元数据中的参考固件版本；实际设备版本以设备上报为准
        gattServices:
          type: array
          items:
            $ref: "#/components/schemas/GATTService"
        compatibility:
          $ref: "#/components/schemas/Compatibility"

    DeviceType:
      type: object
      required: [type, name, vendor, description, gattServices]
      properties:
        type:
          type: string
        name:
          type: string
        vendor:
          type: string
        description:
          type: string
        gattServices:
          type: array
          items:
            $ref: "#/components/schemas/GATTService"
        compatibility:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Compatibility"
          description: 型号级兼容性；未核实的型号为 null

    Firmware:
      type: object
      required: [id, deviceType, version, vendor, releaseNotes, releasedAt, compatibility]
      properties:
        id:
          type: string
        deviceType:
          type: string
        version:
          type: string
        vendor:
          type: string
          description: 固件发布方；未核实的记录为空字符串，不编造
        releaseNotes:
          type: string
        releasedAt:
          type: string
          description: 发布日期；未核实的记录为空字符串，不编造
        compatibility:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Compatibility"
          description: 固件兼容性；供市场模块按平台/协议筛选

    Accessory:
      type: object
      required: [id, deviceType, name, sku, vendor, description, compatibility]
      properties:
        id:
          type: string
        deviceType:
          type: string
        name:
          type: string
        sku:
          type: string
          description: 厂商 SKU；未核实的记录为空字符串，不编造
        vendor:
          type: string
          description: 配件厂商；通用配件可为空字符串
        description:
          type: string
        compatibility:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Compatibility"
          description: 配件兼容性（如 `deviceTypes`）；供市场模块按适配型号筛选

    DeviceCatalog:
      type: object
      required: [deviceType, firmwares, accessories]
      properties:
        deviceType:
          $ref: "#/components/schemas/DeviceType"
        firmwares:
          type: array
          items:
            $ref: "#/components/schemas/Firmware"
        accessories:
          type: array
          items:
            $ref: "#/components/schemas/Accessory"

    UserDevice:
      type: object
      required: [id, clientId, platform, externalId, alias, advertisedName, group, rules, scanRecords, updatedAt, serverSeq]
      properties:
        id:
          type: string
          format: uuid
          description: 客户端生成的设备 UUID
        clientId:
          type: string
          description: 最后写入该记录的客户端标识
        platform:
          type: string
          enum: [android, ios]
          description: 设备所属平台；唯一键的一部分
        externalId:
          type: string
          description: |
            平台内稳定设备标识，唯一键的一部分。
            Android 为规范化大写 MAC；iOS 为 CBPeripheral.identifier（UUID，大写）。
        mac:
          type: string
          description: 可选 MAC 元数据；iOS 设备通常为空，不参与唯一约束
        alias:
          type: string
          description: 用户设置的别名；不会因设备广播名变化而被覆盖
        advertisedName:
          type: string
          description: 设备广播名（BLE Local Name）；与 alias 独立，可为空串
        group:
          type: string
          description: 用户分组；空串表示未分组（已显式清除）
        rules:
          type: object
          additionalProperties: true
        scanRecords:
          type: array
          items:
            type: object
            additionalProperties: true
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: tombstone 时间；未删除时不出现
        serverSeq:
          type: integer
          format: int64
          description: 最近一次写入对应的 change_log seq
        deviceType:
          type: string
          nullable: true
          description: |
            设备所属型号，用于 iOS/Android 详情页直接展示。
            优先取用户记录上报的 `deviceType`，缺失时按 `mac` 关联公共设备元数据；
            均未命中时为 null（不报错）。
        vendor:
          type: string
          nullable: true
          description: 厂商；按 `mac` 关联公共元数据，缺失时回退到型号元数据，仍无则为 null
        firmwareVersion:
          type: string
          nullable: true
          description: 参考固件版本，来自公共设备元数据；未命中时为 null
        compatibility:
          type: object
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Compatibility"
          description: 兼容性；优先取公共设备元数据，缺失时回退到型号元数据，仍无则为 null

    PushDevice:
      type: object
      required: [id, updatedAt]
      description: |
        设备唯一键为 `platform + externalId`。
        - 新客户端必须显式携带 `platform` 与 `externalId`；
        - 兼容旧 Android 客户端：`platform` 缺省为 `android`，`externalId` 可由 `mac` 派生；
        - iOS 必须携带 `platform="ios"` 与 `externalId`（CBPeripheral.identifier），`mac` 可省略。
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [android, ios]
          default: android
          description: 缺省为 android（兼容旧客户端）
        externalId:
          type: string
          maxLength: 128
          description: Android 为大写 MAC；iOS 为 CBPeripheral.identifier（UUID）
        mac:
          type: string
          description: 可选 MAC 元数据；Android 会自动填充为小写 MAC，iOS 可省略
        deviceType:
          type: string
          maxLength: 64
          description: |
            可选设备型号（如 `nordic_uart`），服务端统一转小写。
            上报后可用于关联公共元数据；缺省时服务端尝试按 `mac` 推导。
        alias:
          type: string
          maxLength: 100
          description: |
            用户设置的别名。缺省（absent）= 未上报，保持服务端原值；
            只有用户编辑别名时才应上报。上报不会影响 `advertisedName`。
        advertisedName:
          type: string
          maxLength: 248
          description: |
            设备广播名（BLE Local Name）。缺省 = 未上报，保持原值；
            客户端扫描到广播名变化时可覆盖上报，不会影响用户别名 `alias`。
        group:
          type: string
          maxLength: 64
          description: |
            用户分组。缺省（absent）= 未上报，保持原值；
            空串 `""` = 显式清除分组，服务端将 `group` 置为空串。
        rules:
          type: object
          additionalProperties: true
        scanRecords:
          type: array
          items:
            type: object
            additionalProperties: true
        updatedAt:
          type: string
          format: date-time
          description: 客户端最后修改时间；超前服务端 2 分钟以上会被服务端时间兜底
        deleted:
          type: boolean
          default: false

    PushRequest:
      type: object
      description: |
        `devices` 与 `readings` 均为可选，但至少提供一个；两者都缺失或都为空数组返回 400。
      properties:
        clientId:
          type: string
          maxLength: 128
        devices:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PushDevice"
        readings:
          type: array
          maxItems: 500
          description: |
            可选（自 `0.4.0`）。按 `id` 幂等批量写入，不需要设备已注册。
          items:
            $ref: "#/components/schemas/PushReading"

    PushReading:
      type: object
      required: [id, platform, externalId, metric, value, unit, recordedAt]
      properties:
        id:
          type: string
          format: uuid
          description: 客户端生成的读数 id；服务端按它幂等，全局唯一
        platform:
          type: string
          enum: [android, ios]
        externalId:
          type: string
          maxLength: 128
          description: 设备唯一键。Android 为 MAC（规范化为大写）；iOS 为 UUID
        metric:
          type: string
          minLength: 1
          maxLength: 32
          pattern: "^[a-z][a-z0-9_]*$"
          description: 指标名，小写 snake_case（小写字母开头，只含小写字母、数字与下划线）
        value:
          type: number
          format: double
          description: 测量值；必须是有限浮点数（NaN/Inf 返回 400）
        unit:
          type: string
          maxLength: 16
          description: 单位，0–16 字符（允许空串，空串表示无量纲）
        recordedAt:
          type: string
          format: date-time
          description: 测量时间（RFC3339）；超前服务端 5 分钟以上返回 400 BAD_REQUEST
        deviceType:
          type: string
          maxLength: 64
          description: |
            可选设备型号。缺省时服务端尝试按 MAC（Android）或已注册设备推导，
            仍无法关联则为 null，不影响写入。

    AppliedChange:
      type: object
      required: [id, platform, externalId, status, serverSeq]
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [android, ios]
        externalId:
          type: string
        mac:
          type: string
          description: 可选 MAC 元数据；iOS 通常为空
        status:
          type: string
          enum: [applied, unchanged]
        serverSeq:
          type: integer
          format: int64

    Conflict:
      type: object
      required: [id, platform, externalId, reason]
      description: |
        设备冲突（`entity` 省略）：`server` 与 `client` 为设备对象。
        读数冲突：`entity: "reading"`、`reason: "duplicate_id"`，提供 `reading`，
        不提供 `server`/`client`。
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [android, ios]
        externalId:
          type: string
        mac:
          type: string
        entity:
          type: string
          enum: [reading]
          description: 仅读数冲突出现；缺省表示 user_device 冲突（兼容旧客户端）
        reason:
          type: string
          enum: [server_newer, clock_clamped, key_taken, duplicate_id]
          description: |
            key_taken 表示 (platform, externalId) 已被同用户的其他设备占用；
            duplicate_id 表示读数 id 已存在且内容不同（一次性读数不可修改）。
        server:
          $ref: "#/components/schemas/UserDevice"
        client:
          $ref: "#/components/schemas/PushDevice"
        reading:
          $ref: "#/components/schemas/Reading"

    PushResult:
      type: object
      required: [applied, conflicts, nextCursor, appliedReadings, skippedReadings]
      properties:
        applied:
          type: array
          items:
            $ref: "#/components/schemas/AppliedChange"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/Conflict"
        nextCursor:
          type: integer
          format: int64
        appliedReadings:
          type: integer
          description: 本次实际写入的读数条数（自 `0.4.0`）；未提交 readings 时为 0
        skippedReadings:
          type: integer
          description: 按 id 幂等跳过的读数条数（自 `0.4.0`）；未提交 readings 时为 0

    Change:
      type: object
      required: [seq, entity, entityId, op, payload, serverTs]
      properties:
        seq:
          type: integer
          format: int64
        entity:
          type: string
          example: user_device
        entityId:
          type: string
          description: |
            复合键派生的稳定字符串：`<userId>:<platform>:<externalId>`。
            旧变更（000003 迁移前）已在迁移时回填为同一形式。
        op:
          type: string
          enum: [upsert, delete]
        payload:
          $ref: "#/components/schemas/UserDevice"
        serverTs:
          type: string
          format: date-time

    ChangesPage:
      type: object
      required: [changes, nextCursor, hasMore]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
        nextCursor:
          type: integer
          format: int64
        hasMore:
          type: boolean

    Reading:
      type: object
      required: [id, metric, value, unit, recordedAt]
      properties:
        id:
          type: string
          format: uuid
        metric:
          type: string
          example: temperature_celsius
        value:
          type: number
          format: double
        unit:
          type: string
          description: 单位；空串表示无量纲
        recordedAt:
          type: string
          format: date-time

    ReadingsPage:
      type: object
      required: [items, nextCursor, hasMore]
      description: 按 `recordedAt` 倒序；`nextCursor` 为空串表示没有更多。
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Reading"
        nextCursor:
          type: string
          description: 不透明游标，直接回传即可
        hasMore:
          type: boolean

    ReadingsSummary:
      type: object
      required: [metric, unit, count, min, max, avg, last, windowStart, windowEnd]
      properties:
        metric:
          type: string
        unit:
          type: string
          description: 窗口内最新读数的单位；无数据时为空串
        count:
          type: integer
          format: int64
        min:
          type: number
          format: double
          nullable: true
        max:
          type: number
          format: double
          nullable: true
        avg:
          type: number
          format: double
          nullable: true
        last:
          type: number
          format: double
          nullable: true
          description: 窗口内 `recordedAt` 最新的值；无数据时为 null
        windowStart:
          type: string
          format: date-time
          description: now - hours
        windowEnd:
          type: string
          format: date-time
          description: now

    ReadingsBucket:
      type: object
      required: [start, end, count, min, max, avg, last]
      description: UTC 对齐的单个时间桶；只出现在 `count > 0` 的桶。
      properties:
        start:
          type: string
          format: date-time
          description: 桶起点（含），UTC 对齐
        end:
          type: string
          format: date-time
          description: 桶终点（不含）= start + bucket
        count:
          type: integer
          format: int64
        min:
          type: number
          format: double
        max:
          type: number
          format: double
        avg:
          type: number
          format: double
        last:
          type: number
          format: double
          description: 桶内 `recordedAt` 最大的值

    ReadingsSeries:
      type: object
      required: [metric, unit, bucket, from, to, buckets]
      description: 按 `start` 升序；只含有数据的桶，无数据时 `buckets` 为空数组。
      properties:
        metric:
          type: string
        unit:
          type: string
          description: 时间范围内最新一条读数的单位；无数据时为空串
        bucket:
          type: string
          enum: ["1m", "1h", "1d"]
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/ReadingsBucket"

    ReadingMetric:
      type: object
      required: [metric, unit, count, firstAt, lastAt]
      properties:
        metric:
          type: string
        unit:
          type: string
          description: 该指标最近一条读数的单位（多单位时以此为准）
        count:
          type: integer
          format: int64
        firstAt:
          type: string
          format: date-time
        lastAt:
          type: string
          format: date-time

    ReadingMetrics:
      type: object
      required: [items]
      description: 按 `lastAt` 倒序（同一时间按 `metric` 升序）；无数据时 `items` 为空数组。
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReadingMetric"

    PairingCodeResponse:
      type: object
      required: [code, expiresAt]
      description: 一次性配对码；仅在本响应出现，服务端只保存哈希。
      properties:
        code:
          type: string
          pattern: "^[A-HJ-NP-Z2-9]{8}$"
          description: 8 位大写字母数字，已剔除易混的 0/O/1/I
          example: K7M2QX9P
        expiresAt:
          type: string
          format: date-time
          description: 过期时间（签发后 10 分钟，UTC）

    PairingClaimRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 16
          description: 用户输入的配对码；服务端去空白并转大写后校验
          example: K7M2QX9P

    PairingClaimResponse:
      type: object
      required: [userId, token]
      description: 配对成功；token 为同一 userId 的新 token，原 token 仍然有效。
      properties:
        userId:
          type: string
          format: uuid
        token:
          type: string
          description: 新的不透明 token，客户端应持久化并替换当前 token

    ExportUser:
      type: object
      required: [id, kind, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          example: anonymous
        createdAt:
          type: string
          format: date-time

    ExportReading:
      type: object
      required: [id, platform, externalId, metric, value, unit, recordedAt]
      properties:
        id:
          type: string
          format: uuid
          description: 客户端生成的读数 id
        platform:
          type: string
          enum: [android, ios]
        externalId:
          type: string
        metric:
          type: string
        value:
          type: number
          format: double
        unit:
          type: string
        recordedAt:
          type: string
          format: date-time
        deviceType:
          type: string
          nullable: true
          description: 读数上报时携带的设备类型；未上报时省略

    ExportPage:
      type: object
      required: [user, devices, readings, exportedAt, nextCursor, hasMore]
      properties:
        user:
          $ref: "#/components/schemas/ExportUser"
        devices:
          type: array
          description: 全部设备，含已删除（tombstone），按 updatedAt 倒序
          items:
            $ref: "#/components/schemas/UserDevice"
        readings:
          type: array
          description: 按 recordedAt 升序（同一时刻按 id 升序）
          items:
            $ref: "#/components/schemas/ExportReading"
        exportedAt:
          type: string
          format: date-time
        nextCursor:
          type: string
          description: 下一页游标；`hasMore=false` 时为空串
        hasMore:
          type: boolean

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pjgoiot
          POSTGRES_PASSWORD: pjgoiot
          POSTGRES_DB: pjgoiot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pjgoiot -d pjgoiot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pjgoiot:pjgoiot@127.0.0.1:5432/pjgoiot_test?sslmode=disable
      TEST_DATABASE_URL: postgres://pjgoiot:pjgoiot@127.0.0.1:5432/pjgoiot_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: gofmt 检查
        run: |
          out=$(gofmt -l . | grep -v '^internal/store/postgres/sqlcgen/' || true)
          if [ -n "$out" ]; then echo "以下文件未格式化:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: 单元测试
        run: go test ./...

      - name: 迁移
        run: go run ./cmd/migrate -direction up

      - name: Postgres 集成测试
        run: go test ./internal/store/postgres -run 'TestPostgres|TestCleanupAndRetentionLifecycle|TestMigrationBackfillsLegacyDevices|TestSharedRateLimiterAcrossInstances|TestHousehold' -v

      - name: OpenAPI 契约校验
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml

  perf-smoke:
    name: 压测门槛（smoke）
    runs-on: ubuntu-latest
    needs: build-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pjgoiot
          POSTGRES_PASSWORD: pjgoiot
          POSTGRES_DB: pjgoiot_perf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pjgoiot -d pjgoiot_perf"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pjgoiot:pjgoiot@127.0.0.1:5432/pjgoiot_perf?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 启动 API（STORE=postgres）
        run: |
          set -euo pipefail
          go build -o /tmp/pjgoiot-api ./cmd/api
          STORE=postgres \
            DATABASE_URL="$DATABASE_URL" \
            RUN_MIGRATIONS_ON_BOOT=true \
            RATE_LIMIT_PER_MINUTE=0 \
            RATE_LIMIT_BURST=0 \
            PAIRING_CLAIM_RATE_PER_MINUTE=0 \
            PAIRING_CLAIM_BURST=0 \
            APP_VERSION=0.18.0 \
            ADDR=127.0.0.1:18080 \
            /tmp/pjgoiot-api >/tmp/api.log 2>&1 &
          echo $! >/tmp/api.pid
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:18080/api/v1/health >/dev/null 2>&1; then
              echo "API readiness 通过"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/api.pid)" 2>/dev/null; then
              echo "API 进程已退出"
              cat /tmp/api.log
              exit 1
            fi
            sleep 1
          done
          echo "API 60s 内未就绪"
          cat /tmp/api.log
          exit 1

      - name: 运行 smoke（错误率或 p95 超阈值即失败）
        run: go run ./cmd/loadgen -base-url http://127.0.0.1:18080 -smoke

      - name: 失败时输出 API 日志
        if: failure()
        run: tail -n 120 /tmp/api.log

  docker-build:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: docker build（不推送）
        run: docker build -t pjgoiot-api:ci .

  # 只在 push 时运行；不依赖 Docker 守护进程（compose 仅做静态解析）。
  lint-configs:
    name: 配置与脚本校验
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 清理与压测工具静态校验（不实际压测）
        run: |
          set -euo pipefail
          go build -o /tmp/cleanup ./cmd/cleanup
          go build -o /tmp/loadgen ./cmd/loadgen
          go vet ./cmd/cleanup ./cmd/loadgen
          /tmp/loadgen -h >/dev/null
          /tmp/cleanup -h >/dev/null
          echo "cleanup/loadgen 编译与 flag 解析 ok"

      - name: 校验 YAML 与编排关键约束
        run: |
          ruby -ryaml <<'RUBY'
          files = %w[docker-compose.yml deploy/prometheus/alerts.yml deploy/prometheus/scrape.yml]
          files.each do |f|
            YAML.load_file(f, aliases: true)
            puts "YAML ok: #{f}"
          end

          compose = YAML.load_file('docker-compose.yml', aliases: true)
          %w[api1 api2 postgres caddy].each do |svc|
            abort "compose 缺少服务: #{svc}" unless compose.fetch('services').key?(svc)
          end
          %w[api1 api2].each do |name|
            api = compose['services'][name]
            abort "#{name} 未等待 postgres 健康" unless api.dig('depends_on', 'postgres', 'condition') == 'service_healthy'
            abort "#{name} 未启用只读文件系统" unless api['read_only'] == true
            abort "#{name} 缺少 drain 配置" unless api.dig('environment', 'SHUTDOWN_DRAIN_SECONDS')
          end
          caddy = compose['services']['caddy']
          %w[api1 api2].each do |name|
            abort "caddy 未等待 #{name} 健康" unless caddy.dig('depends_on', name, 'condition') == 'service_healthy'
          end
          abort 'caddy 未暴露 443' unless caddy['ports'].map(&:to_s).any? { |p| p.include?('443') }
          abort 'cleanup 未使用 maintenance profile' unless compose['services']['cleanup']['profiles'].include?('maintenance')

          caddyfile = File.read('deploy/Caddyfile')
          abort 'Caddyfile 未配置双实例上游' unless caddyfile.include?('api1:8080 api2:8080')
          abort 'Caddyfile 未使用 readiness 健康检查' unless caddyfile.include?('health_uri /api/v1/health')
          abort 'Caddyfile 未配置上游重试' unless caddyfile.include?('lb_try_duration')

          alerts = YAML.load_file('deploy/prometheus/alerts.yml', aliases: true)
          rules = alerts.fetch('groups').flat_map { |g| g.fetch('rules') }
          abort "告警规则少于 5 条: #{rules.size}" if rules.size < 5
          rules.each do |r|
            abort "规则缺少 alert/expr: #{r.inspect}" unless r['alert'] && r['expr']
            abort "规则缺少 for: #{r['alert']}" unless r['for'] && r['labels'] && r['annotations']
          end
          puts "alerts ok: #{rules.size} rules"
          RUBY

      - name: 校验 Grafana dashboard（JSON 结构与指标名）
        run: bash scripts/validate-dashboard.sh

      - name: 脚本语法与 shellcheck
        run: |
          set -euo pipefail
          scripts=(deploy/scripts/backup.sh deploy/scripts/restore.sh
            scripts/stack-for-e2e.sh scripts/seed-for-e2e.sh scripts/validate-dashboard.sh
            scripts/migrate-drill.sh scripts/rolling-restart.sh scripts/multi-instance-check.sh
            scripts/migration-concurrency-check.sh scripts/shared-rate-limit-check.sh)
          for f in "${scripts[@]}"; do
            bash -n "$f"
            echo "bash -n ok: $f"
          done
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x "${scripts[@]}"
            echo "shellcheck ok"
          else
            echo "shellcheck 不可用，仅执行 bash -n（未安装时不伪造通过）"
          fi
          if command -v shfmt >/dev/null 2>&1; then
            shfmt -d "${scripts[@]}"
            echo "shfmt ok"
          else
            echo "shfmt 不可用，跳过格式检查"
          fi

      - name: compose 静态解析（不依赖守护进程）
        run: |
          if docker compose version >/dev/null 2>&1; then
            docker compose config --quiet
            echo "docker compose config ok"
          else
            echo "docker compose 不可用，跳过（YAML 结构已由 ruby 校验）"
          fi

      - name: Prometheus 规则校验
        run: |
          if command -v promtool >/dev/null 2>&1; then
            promtool check rules deploy/prometheus/alerts.yml
            echo "promtool ok"
          else
            echo "promtool 不可用，跳过；规则 YAML 结构已在前面校验（未做语义校验）"
          fi

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pjgoiot
          POSTGRES_PASSWORD: pjgoiot
          POSTGRES_DB: pjgoiot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pjgoiot -d pjgoiot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pjgoiot:pjgoiot@127.0.0.1:5432/pjgoiot_test?sslmode=disable
      TEST_DATABASE_URL: postgres://pjgoiot:pjgoiot@127.0.0.1:5432/pjgoiot_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: gofmt 检查
        run: |
          out=$(gofmt -l . | grep -v '^internal/store/postgres/sqlcgen/' || true)
          if [ -n "$out" ]; then echo "以下文件未格式化:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: 单元测试
        run: go test ./...

      - name: 迁移
        run: go run ./cmd/migrate -direction up

      - name: Postgres 集成测试
        run: go test ./internal/store/postgres -run TestPostgresStoreIntegration -v

  docker-build:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: docker build（不推送）
        run: docker build -t pjgoiot-api:ci .
